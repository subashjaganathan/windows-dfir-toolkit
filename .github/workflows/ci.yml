name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # PSScriptAnalyzer powers gate 3. Installed explicitly so the gate always
      # runs on CI (rather than being skipped as it is on a bare machine).
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      # Full safety net under Windows PowerShell 5.1 (the toolkit's target runtime):
      # parse-lint, orchestrator integrity, static analysis.
      - name: Run all tests
        shell: powershell
        run: .\test\Run-AllTests.ps1

  # GitHub's Windows runners are elevated, so this job runs the REAL collection
  # (Security .evtx, registry hives) through both entry points - the scripts and
  # the self-extracting .exe - plus custody-transfer verification and the
  # Constrained Language refusal.
  elevated-collection:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Real elevated collection (script + exe + CLM)
        shell: powershell
        run: .\test\Test-ElevatedCollection.ps1
